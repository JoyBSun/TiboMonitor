name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build, test and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\build-release.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $releaseDir = "release\$tag"
          gh release create $tag `
            "$releaseDir\TiboMonitor-win-x64-$tag.zip#TiboMonitor Windows x64 installer" `
            "$releaseDir\TiboMonitor-win-x64-$tag.zip.sha256#SHA256 checksum" `
            --verify-tag `
            --title "TiboMonitor $tag" `
            --notes-file RELEASE_NOTES.md
